<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Management — HBD My Love</title>
    <script>document.documentElement.classList.add('auth-checking');</script>
    <link rel="stylesheet" href="admin.css" />
    <style>td>button{border:1px solid rgba(255,255,255,.13);border-radius:9px;padding:7px 9px;background:rgba(255,255,255,.04);color:#d8c9ff;font-size:10px;cursor:pointer}</style>
  </head>
  <body>
    <header class="admin-header">
      <a href="dashboard.html">← Dashboard</a>
      <div><b>HBD Admin</b><span id="accountEmail">Admin</span></div>
      <button id="logoutBtn" type="button">Logout</button>
    </header>
    <main>
      <section class="admin-hero">
        <div><p class="eyebrow">Access control</p><h1>User Management</h1><p>ดูบัญชี จำนวน Experience และควบคุมการใช้งานระบบ</p></div>
        <button id="refreshUsersBtn" type="button">Refresh</button>
      </section>
      <section class="metrics" id="adminMetrics">
        <div><b id="totalUsers">–</b><span>Users</span></div><div><b id="activeUsers">–</b><span>Active</span></div><div><b id="disabledUsers">–</b><span>Disabled</span></div><div><b id="totalExperiences">–</b><span>Experiences</span></div>
      </section>
      <div class="toolbar"><input id="userSearch" type="search" placeholder="ค้นหา Email หรือ User ID" /><span id="adminStatus" role="status" aria-live="polite">กำลังตรวจสอบสิทธิ์…</span></div>
      <section id="adminMessage" class="admin-message" hidden></section>
      <section class="user-table-wrap">
        <table>
          <thead><tr><th>User</th><th>Role</th><th>Status</th><th>Experiences</th><th>สมัครเมื่อ</th><th>เข้าสู่ระบบล่าสุด</th><th>Actions</th></tr></thead>
          <tbody id="userRows"></tbody>
        </table>
      </section>
    </main>
    <dialog id="experienceDialog">
      <div class="dialog-head"><div><p class="eyebrow">Row details</p><h2 id="experienceDialogTitle">Experiences</h2></div><button id="closeExperienceDialog" type="button">×</button></div>
      <div id="userExperienceList" class="experience-list"></div>
    </dialog>
    <script type="module" src="admin.js"></script>
    <script type="module" src="auth-guard.js"></script>
  </body>
</html>
