<!doctype html><meta charset="utf-8"><iframe id="settings" src="settings.html#avatar" style="width:430px;height:1000px"></iframe><output id="result">WAITING</output>
<script>
const frame=document.getElementById('settings');frame.addEventListener('load',()=>setTimeout(()=>{
  const doc=frame.contentDocument,url=doc.getElementById('avatarUrlInput');url.value='https://drive.google.com/file/d/1NtaFheMNxn_k0kI2OOlyfqkVyAH2J5P6/view?usp=sharing';url.dispatchEvent(new Event('change',{bubbles:true}));
  const zoom=doc.getElementById('avatarZoom');zoom.value='1.5';zoom.dispatchEvent(new Event('input',{bubbles:true}));
  const x=doc.getElementById('avatarOffsetX');x.value='12';x.dispatchEvent(new Event('input',{bubbles:true}));
  setTimeout(()=>{
    const pdoc=doc.getElementById('previewFrame').contentDocument,img=pdoc.getElementById('birthdayAvatar'),hat=pdoc.getElementById('birthdayAvatarHat'),stored=JSON.parse(localStorage.getItem('hbd-experience-draft-v1'));
    const root=doc.documentElement,passed=url.value.includes('thumbnail?id=1NtaFheMNxn_k0kI2OOlyfqkVyAH2J5P6')&&img.src.includes('thumbnail?id=1NtaFheMNxn_k0kI2OOlyfqkVyAH2J5P6')&&img.style.transform.includes('scale(1.5)')&&!hat.hidden&&!stored.birthday.avatarUrl.startsWith('data:image/')&&root.scrollWidth===root.clientWidth;
    document.getElementById('result').textContent=`${passed?'AVATAR_URL_SMOKE_PASS':'AVATAR_URL_SMOKE_FAIL'} width=${root.clientWidth}/${root.scrollWidth} src=${img.src}`;
  },1800);
},500));
</script>
